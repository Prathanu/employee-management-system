# Nginx configuration for React SPA + API reverse proxy
# Serves React static files and proxies /api/* to Spring Boot backend

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for faster loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Proxy API requests to Spring Boot backend container
    # "backend" is the Docker Compose / Kubernetes service name
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Proxy actuator health (for monitoring)
    location /actuator/ {
        proxy_pass http://backend:8080/actuator/;
    }

    # React Router — serve index.html for all non-file routes
    # (prevents 404 on /dashboard, /employees, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (JS, CSS, images)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
