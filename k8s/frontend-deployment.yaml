# React frontend (Nginx) — Deployment
# Container name "frontend" is required by Jenkinsfile: kubectl set image ... frontend=...
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ems-frontend
  namespace: employee-mgmt
  labels:
    app: ems-frontend
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ems-frontend
  template:
    metadata:
      labels:
        app: ems-frontend
        tier: frontend
    spec:
      containers:
        - name: frontend
          # Jenkins overwrites this image on deploy; local default uses Docker-built image
          image: ems-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
