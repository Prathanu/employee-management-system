# Spring Boot backend — Deployment
# Container name "backend" is required by Jenkinsfile: kubectl set image ... backend=...
# Service name "backend" is required by nginx.conf API proxy in frontend image
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ems-backend
  namespace: employee-mgmt
  labels:
    app: ems-backend
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ems-backend
  template:
    metadata:
      labels:
        app: ems-backend
        tier: backend
    spec:
      containers:
        - name: backend
          # Jenkins overwrites this image on deploy; local default uses Docker-built image
          image: ems-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: ems-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ems-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ems-secret
                  key: DB_PASSWORD
          resources:
            requests:
              memory: "384Mi"
              cpu: "200m"
            limits:
              memory: "768Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
