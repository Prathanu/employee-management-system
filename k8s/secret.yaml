# Development credentials — base64 encoded (NOT for production)
# Production: use Sealed Secrets, External Secrets Operator, or Vault
#
# Decode example: echo cm9vdDEyMw== | base64 -d
apiVersion: v1
kind: Secret
metadata:
  name: ems-secret
  namespace: employee-mgmt
  labels:
    app.kubernetes.io/name: employee-management-system
type: Opaque
data:
  # root123
  MYSQL_ROOT_PASSWORD: cm9vdDEyMw==
  # ems_user
  MYSQL_USER: ZW1zX3VzZXI=
  # ems_pass
  MYSQL_PASSWORD: ZW1zX3Bhc3M=
  # ems_user
  DB_USERNAME: ZW1zX3VzZXI=
  # ems_pass
  DB_PASSWORD: ZW1zX3Bhc3M=
