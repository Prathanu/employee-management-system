spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/employee_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:ems_user}
    password: ${DB_PASSWORD:ems_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  h2:
    console:
      enabled: false

app:
  cors:
    allowed-origins: http://localhost,http://localhost:80,http://localhost:3000

logging:
  level:
    com.company.ems: INFO
