# Profile: h2 — Run WITHOUT Docker (recommended if Docker is not installed)
# Command: mvn spring-boot:run
# Or:      mvn spring-boot:run -Dspring-boot.run.profiles=h2

spring:
  config:
    activate:
      on-profile: h2

  datasource:
    url: jdbc:h2:mem:employee_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
